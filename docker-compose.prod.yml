services:
  frontend:
    image: ghcr.io/forthfora/evp-website/frontend:${IMAGE_TAG:-latest}
    container_name: evp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "16017:16017"
    volumes:
      - django_static:/var/www/django/static:ro

  backend:
    image: ghcr.io/forthfora/evp-website/backend:${IMAGE_TAG:-latest}
    container_name: evp-backend
    restart: unless-stopped
    depends_on:
      - redis
    command: >
      sh -c "uv run python manage.py migrate --noinput &&
             uv run python manage.py collectstatic --noinput &&
             uv run gunicorn config.wsgi:application --bind 0.0.0.0:17017"
    volumes:
      - django_static:/app/staticfiles
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    container_name: evp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  django_static:
  redis_data: