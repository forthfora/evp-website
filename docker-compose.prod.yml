services:
  frontend:
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_BASE_URL=https://www.edinburghventurepoint.com
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

  backend:
    environment:
      - DEBUG=False