# The name of the workflow as it appears in the GitHub Actions tab
name: CI/CD Production Deployment

# Controls when the workflow will run
on:
  push:
    # Triggers the workflow only on push events to the main branch
    branches: [main]

# Global environment variables shared across all jobs in this workflow
env:
  # The target Docker registry (GitHub Container Registry)
  REGISTRY: ghcr.io
  # Converts the repository path (e.g., 'username/repo') into lowercase for the image name
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # JOB 1: Builds the frontend and backend Docker images and pushes them to GHCR
  build-and-push:
    # Specifies the type of virtual machine runner to use
    runs-on: ubuntu-latest

    # Permissions required to read code and publish packages to GitHub Packages
    permissions:
      contents: read
      packages: write

    # Build both services defined in docker-compose.yml (frontend + backend)
    strategy:
      matrix:
        service: [frontend, backend]

    steps:
      # Step 1: Clones your repository source code onto the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v6

      # Step 2: Authenticates the runner against GHCR using the short-lived, built-in GITHUB_TOKEN
      - name: Log in to the Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Automatically extracts tags and OCI labels based on Git commits/tags for container tracking
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Step 4: Compiles the service Dockerfile and pushes it directly to GHCR
      # Each service has its own Dockerfile under ./<service>/ (no root Dockerfile exists)
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          # The build context for this service (contains its Dockerfile)
          context: ./${{ matrix.service }}
          # Instructs the runner to push the image to the registry immediately after a successful build
          push: true
          # Repo-scoped package: ghcr.io/<owner>/<repo>/<service> (GITHUB_TOKEN can only write here)
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          # Enable GHA build cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # JOB 2: Connects to your remote server to pull the new container images and launch them
  deploy:
    # Forces this job to wait until 'build-and-push' finishes successfully
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # Step 1: Establishes an SSH tunnel, maps secrets to environmental variables, and runs server commands
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        # We inject our secrets safely into the environment of the remote session shell
        env:
          DEPLOY_USER: ${{ github.actor }}
          DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }} # GitHub PAT
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Expose the env variables block explicitly to the underlying shell script execution
          envs: DEPLOY_USER,DEPLOY_TOKEN
          script: |
            # 1. Stop execution immediately if any command fails
            set -e

            # 2. Navigate to your app directory on the host server where your docker-compose.yml lives
            cd ~/evp-website

            # 3. Log into GitHub Container Registry on the REMOTE server utilizing the injected shell variables
            echo "$DEPLOY_TOKEN" | docker login ghcr.io -u "$DEPLOY_USER" --password-stdin

            # 4. Pull the fresh image that was just compiled and uploaded in the previous GitHub job
            docker compose pull

            # 5. Spin up the containers in detached mode (-d) and wipe out any orphaned containers
            docker compose up -d --remove-orphans

            # 6. Housekeeping: Remove dangling older images from the host server disk to prevent running out of storage
            docker image prune -f
