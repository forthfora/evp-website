services:
  frontend:
    image: ghcr.io/forthfora/evp-frontend:latest
    container_name: evp-frontend
    restart: always
    #network_mode: "host"
    network_mode: "service:backend"
    #ports:
      #- "16017:16017"
      #- "443:16017"
    depends_on:
      - backend
    volumes:
      - /home/rory/evp-website/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - django_static:/var/www/django/static:ro
    #networks:
      #- external

  backend:
    image: ghcr.io/forthfora/evp-backend:latest
    container_name: evp-backend
    restart: always
    #network_mode: "host"
    ports:
      - "16017:16017"
    command: >
      sh -c "uv run python manage.py migrate --noinput &&
             uv run gunicorn config.wsgi:application --bind 127.0.0.1:17017"
    networks:
      - external
    volumes:
      - django_static:/app/staticfiles

networks:
  external:
    name: podman
    external: true

volumes:
  django_static:
