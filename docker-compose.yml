services:
  frontend:
    image: ghcr.io/forthfora/evp-website/frontend:latest
    container_name: evp-frontend
    depends_on:
      - backend
    ports:
      - "16017:16017"
    volumes:
      - django_static:/var/www/django/static:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    build:
      context: ./frontend 
      dockerfile: Dockerfile

  backend:
    image: ghcr.io/forthfora/evp-website/backend:latest
    container_name: evp-backend
    depends_on:
      - redis
    command: >
      sh -c "uv run python manage.py migrate --noinput &&
             uv run python manage.py collectstatic --noinput &&
             uv run gunicorn config.wsgi:application --bind 0.0.0.0:17017 --reload"
    volumes:
      - django_static:/app/staticfiles
      - ./backend:/app
      - /app/.venv
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env

  redis:
    image: redis:7-alpine
    container_name: evp-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  django_static:
  redis_data: