services:
  frontend:
    build:
      context: ./frontend 
      dockerfile: Dockerfile
    depends_on:
      - backend
    volumes:
      - django_static:/var/www/django/static:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - /app/.venv
      - django_static:/app/staticfiles 
    command: >
      sh -c "uv run python manage.py migrate --noinput &&
             uv run python manage.py collectstatic --noinput &&
             uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000"

volumes:
  django_static: