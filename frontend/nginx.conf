server {
    listen 80;

    # 1. Route standard frontend traffic to Vite files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Route API calls directly to the Django container
    location /api/ {
        proxy_pass http://backend:8000; # "backend" matches the service name in docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Route Django admin traffic
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}